<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的作品集</title>
    <style>
        :root {
            --bg-primary: #FFF9E6;
            --bg-secondary: #FFE4B5;
            --bg-tertiary: #FFDAB9;
            --glass-bg: rgba(255, 255, 255, 0.65);
            --glass-border: rgba(255, 255, 255, 0.4);
            --text-primary: #5D4E37;
            --text-secondary: #8B7355;
            --accent-orange: #FFB347;
            --accent-pink: #FFB6C1;
            --accent-blue: #87CEEB;
            --accent-green: #98FB98;
            --shadow-soft: rgba(93, 78, 55, 0.1);
            --shadow-medium: rgba(93, 78, 55, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #FFF9E6 0%, #FFE4B5 50%, #FFDAB9 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(255, 179, 71, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(255, 182, 193, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(135, 206, 235, 0.08) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            box-shadow: 0 8px 32px var(--shadow-soft);
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 20px;
        }

        .container {
            display: flex;
            min-height: 100vh;
            position: relative;
            z-index: 1;
        }

        .sidebar {
            width: 360px;
            padding: 32px 24px;
            display: flex;
            flex-direction: column;
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            overflow-y: auto;
        }

        .sidebar::-webkit-scrollbar {
            width: 6px;
        }

        .sidebar::-webkit-scrollbar-track {
            background: transparent;
        }

        .sidebar::-webkit-scrollbar-thumb {
            background: rgba(93, 78, 55, 0.2);
            border-radius: 3px;
        }

        .main-content {
            flex: 1;
            margin-left: 360px;
            padding: 32px;
            min-height: 100vh;
        }

        .profile-section {
            text-align: center;
            margin-bottom: 32px;
            padding: 24px;
        }

        .avatar-wrapper {
            width: 120px;
            height: 120px;
            margin: 0 auto 16px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-orange), var(--accent-pink));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            box-shadow: 0 8px 24px rgba(255, 179, 71, 0.3);
            position: relative;
        }

        .avatar-wrapper .edit-avatar {
            position: absolute;
            bottom: -4px;
            right: -4px;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: white;
            border: 2px solid var(--accent-orange);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .avatar-wrapper .edit-avatar:hover {
            transform: scale(1.1);
        }

        .profile-name {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .profile-title {
            font-size: 0.95rem;
            color: var(--text-secondary);
            margin-bottom: 16px;
        }

        .profile-bio {
            font-size: 0.85rem;
            color: var(--text-secondary);
            line-height: 1.6;
            text-align: left;
            padding: 12px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 12px;
            border: 1px dashed rgba(255, 179, 71, 0.3);
        }

        .section-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .info-list {
            list-style: none;
            margin-bottom: 24px;
        }

        .info-item {
            padding: 12px 16px;
            margin-bottom: 8px;
            border-radius: 12px;
            transition: all 0.2s;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .info-item:hover {
            background: rgba(255, 255, 255, 0.6);
            transform: translateX(4px);
        }

        .info-item .icon {
            width: 36px;
            height: 36px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .info-item .icon.orange { background: rgba(255, 179, 71, 0.2); color: #E6A23C; }
        .info-item .icon.pink { background: rgba(255, 182, 193, 0.2); color: #E74C6A; }
        .info-item .icon.blue { background: rgba(135, 206, 235, 0.2); color: #3498DB; }
        .info-item .icon.green { background: rgba(152, 251, 152, 0.2); color: #2ECC71; }

        .info-content {
            flex: 1;
        }

        .info-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-bottom: 2px;
        }

        .info-value {
            font-size: 0.9rem;
            color: var(--text-primary);
            font-weight: 500;
        }

        .education-section {
            padding: 20px;
            margin-bottom: 24px;
        }

        .education-list {
            margin-bottom: 16px;
        }

        .education-item {
            padding: 16px;
            margin-bottom: 12px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 16px;
            border-left: 4px solid var(--accent-orange);
            position: relative;
            transition: all 0.2s;
        }

        .education-item:hover {
            background: rgba(255, 255, 255, 0.7);
        }

        .education-item .edit-controls {
            position: absolute;
            right: 12px;
            top: 12px;
            display: none;
            gap: 8px;
        }

        .education-item:hover .edit-controls {
            display: flex;
        }

        .edit-btn, .delete-btn {
            width: 28px;
            height: 28px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            transition: all 0.2s;
        }

        .edit-btn {
            background: rgba(135, 206, 235, 0.3);
            color: #3498DB;
        }

        .edit-btn:hover {
            background: rgba(135, 206, 235, 0.5);
        }

        .delete-btn {
            background: rgba(255, 182, 193, 0.3);
            color: #E74C6A;
        }

        .delete-btn:hover {
            background: rgba(255, 182, 193, 0.5);
        }

        .edu-school {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .edu-degree {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .edu-period {
            font-size: 0.75rem;
            color: var(--accent-orange);
        }

        .add-btn {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: 2px dashed var(--accent-orange);
            background: rgba(255, 179, 71, 0.1);
            color: var(--text-primary);
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .add-btn:hover {
            background: rgba(255, 179, 71, 0.2);
            border-color: #E6A23C;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
        }

        .header h1 {
            font-size: 2rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .header p {
            font-size: 0.95rem;
            color: var(--text-secondary);
        }

        .action-buttons {
            display: flex;
            gap: 12px;
        }

        .btn {
            padding: 12px 24px;
            border-radius: 12px;
            border: none;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-orange), var(--accent-pink));
            color: white;
            box-shadow: 0 4px 12px rgba(255, 179, 71, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(255, 179, 71, 0.4);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.7);
            color: var(--text-primary);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.9);
        }

        .filter-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
            padding: 8px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 16px;
        }

        .filter-tab {
            padding: 10px 20px;
            border-radius: 12px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
        }

        .filter-tab.active {
            background: white;
            color: var(--text-primary);
            box-shadow: 0 2px 8px var(--shadow-soft);
        }

        .works-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 24px;
        }

        .work-card {
            padding: 24px;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .work-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--accent-orange), var(--accent-pink));
            opacity: 0;
            transition: opacity 0.3s;
        }

        .work-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 32px var(--shadow-medium);
        }

        .work-card:hover::before {
            opacity: 1;
        }

        .work-card.dragging {
            opacity: 0.5;
            transform: scale(1.02);
            box-shadow: 0 16px 40px rgba(255, 179, 71, 0.3);
        }

        .work-category {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 500;
            margin-bottom: 12px;
        }

        .work-category.prose {
            background: rgba(135, 206, 235, 0.2);
            color: #3498DB;
        }

        .work-category.poem {
            background: rgba(255, 182, 193, 0.2);
            color: #E74C6A;
        }

        .work-category.award {
            background: rgba(255, 215, 0, 0.2);
            color: #DAA520;
        }

        .work-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 8px;
            line-height: 1.4;
        }

        .work-excerpt {
            font-size: 0.85rem;
            color: var(--text-secondary);
            line-height: 1.6;
            display: -webkit-box;
            -webkit-line-clamp: 4;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-bottom: 16px;
        }

        .work-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .work-meta .actions {
            display: none;
            gap: 8px;
        }

        .work-card:hover .work-meta .actions {
            display: flex;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        .empty-state .empty-icon {
            font-size: 64px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .empty-state h3 {
            font-size: 1.25rem;
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        .empty-state p {
            font-size: 0.9rem;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .modal-overlay.show {
            display: flex;
            opacity: 1;
        }

        .modal {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 32px;
            width: 90%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
            transform: scale(0.95) translateY(20px);
            transition: all 0.3s;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
        }

        .modal-overlay.show .modal {
            transform: scale(1) translateY(0);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .modal-header h2 {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .modal-close {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            background: rgba(0, 0, 0, 0.05);
            color: var(--text-secondary);
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .modal-close:hover {
            background: rgba(0, 0, 0, 0.1);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid rgba(93, 78, 55, 0.15);
            background: rgba(255, 255, 255, 0.8);
            font-size: 0.9rem;
            color: var(--text-primary);
            transition: all 0.2s;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--accent-orange);
            box-shadow: 0 0 0 3px rgba(255, 179, 71, 0.2);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 120px;
        }

        .form-actions {
            display: flex;
            gap: 12px;
            margin-top: 32px;
        }

        .form-actions .btn {
            flex: 1;
            justify-content: center;
        }

        .view-modal .modal {
            max-width: 800px;
        }

        .view-content {
            padding: 16px 0;
        }

        .view-content .view-category {
            display: inline-block;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
            margin-bottom: 16px;
        }

        .view-content .view-category.prose {
            background: rgba(135, 206, 235, 0.2);
            color: #3498DB;
        }

        .view-content .view-category.poem {
            background: rgba(255, 182, 193, 0.2);
            color: #E74C6A;
        }

        .view-content .view-category.award {
            background: rgba(255, 215, 0, 0.2);
            color: #DAA520;
        }

        .view-content h2 {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 16px;
            line-height: 1.4;
        }

        .view-content .view-date {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 24px;
        }

        .view-content .view-body {
            font-size: 1.05rem;
            line-height: 1.8;
            color: var(--text-primary);
            white-space: pre-wrap;
        }

        .sort-hint {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        @media (max-width: 1024px) {
            .sidebar {
                width: 300px;
            }

            .main-content {
                margin-left: 300px;
            }
        }

        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }

            .sidebar {
                position: static;
                width: 100%;
                padding: 24px 16px;
                border-bottom-left-radius: 0;
                border-bottom-right-radius: 0;
            }

            .main-content {
                margin-left: 0;
                padding: 24px 16px;
            }

            .works-grid {
                grid-template-columns: 1fr;
            }

            .modal {
                padding: 24px 16px;
                margin: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <aside class="sidebar glass">
            <div class="profile-section">
                <div class="avatar-wrapper">
                    👤
                    <span class="edit-avatar" onclick="openEditProfile()">✏️</span>
                </div>
                <div class="profile-name" id="profileName">你的名字</div>
                <div class="profile-title" id="profileTitle">作家 / 诗人</div>
                <div class="profile-bio" id="profileBio" onclick="openEditProfile()">点击编辑个人简介...</div>
            </div>

            <div class="section-title">📋 基本信息</div>
            <ul class="info-list">
                <li class="info-item" onclick="openEditInfo('email')">
                    <div class="icon blue">✉️</div>
                    <div class="info-content">
                        <div class="info-label">邮箱</div>
                        <div class="info-value" id="infoEmail">your@email.com</div>
                    </div>
                </li>
                <li class="info-item" onclick="openEditInfo('phone')">
                    <div class="icon green">📱</div>
                    <div class="info-content">
                        <div class="info-label">电话</div>
                        <div class="info-value" id="infoPhone">138-0000-0000</div>
                    </div>
                </li>
                <li class="info-item" onclick="openEditInfo('location')">
                    <div class="icon orange">📍</div>
                    <div class="info-content">
                        <div class="info-label">所在地</div>
                        <div class="info-value" id="infoLocation">城市名称</div>
                    </div>
                </li>
            </ul>

            <div class="education-section glass-panel">
                <div class="section-title">🎓 教育经历</div>
                <div class="education-list" id="educationList">
                    <div class="education-item">
                        <div class="edit-controls">
                            <button class="edit-btn" onclick="editEducation(this)">✏️</button>
                            <button class="delete-btn" onclick="deleteEducation(this)">🗑️</button>
                        </div>
                        <div class="edu-school">学校名称</div>
                        <div class="edu-degree">学历 / 专业</div>
                        <div class="edu-period">20XX - 20XX</div>
                    </div>
                </div>
                <button class="add-btn" onclick="addEducation()">
                    <span>➕</span> 添加教育经历
                </button>
            </div>
        </aside>

        <main class="main-content">
            <div class="header">
                <div>
                    <h1>我的作品集</h1>
                    <p>记录每一段文字，收藏每一份感动</p>
                </div>
                <div class="action-buttons">
                    <button class="btn btn-secondary" onclick="toggleSortHint()">
                        <span>🔄</span> 重新排序
                    </button>
                    <button class="btn btn-primary" onclick="openAddWork()">
                        <span>➕</span> 添加作品
                    </button>
                </div>
            </div>

            <div class="sort-hint" id="sortHint" style="display: none;">
                <span>👆</span> 拖拽卡片调整排列顺序
            </div>

            <div class="filter-tabs">
                <button class="filter-tab active" data-filter="all" onclick="filterWorks('all')">全部</button>
                <button class="filter-tab" data-filter="prose" onclick="filterWorks('prose')">散文</button>
                <button class="filter-tab" data-filter="poem" onclick="filterWorks('poem')">诗歌</button>
                <button class="filter-tab" data-filter="award" onclick="filterWorks('award')">获奖作品</button>
            </div>

            <div class="works-grid" id="worksGrid" ondragover="allowDrop(event)" ondrop="dropWork(event)">
            </div>
        </main>
    </div>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-header">
                <h2 id="modalTitle">添加作品</h2>
                <button class="modal-close" onclick="closeModal()">✕</button>
            </div>
            <form id="workForm" onsubmit="saveWork(event)">
                <input type="hidden" id="workId">
                <div class="form-group">
                    <label>标题</label>
                    <input type="text" id="workTitle" placeholder="请输入作品标题" required>
                </div>
                <div class="form-group">
                    <label>分类</label>
                    <select id="workCategory" required>
                        <option value="prose">散文</option>
                        <option value="poem">诗歌</option>
                        <option value="award">获奖作品</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>日期</label>
                    <input type="date" id="workDate" required>
                </div>
                <div class="form-group">
                    <label>作品内容</label>
                    <textarea id="workContent" placeholder="在此粘贴你的作品内容..." required></textarea>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">取消</button>
                    <button type="submit" class="btn btn-primary">保存</button>
                </div>
            </form>
        </div>
    </div>

    <div class="modal-overlay view-modal" id="viewModalOverlay">
        <div class="modal">
            <div class="modal-header">
                <h2 style="font-size: 1.25rem;">作品详情</h2>
                <button class="modal-close" onclick="closeViewModal()">✕</button>
            </div>
            <div class="view-content" id="viewContent">
            </div>
            <div class="form-actions" style="margin-top: 24px;">
                <button class="btn btn-secondary" onclick="editCurrentWork()">编辑</button>
                <button class="btn btn-primary" onclick="closeViewModal()">关闭</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="educationModalOverlay">
        <div class="modal">
            <div class="modal-header">
                <h2 id="eduModalTitle">添加教育经历</h2>
                <button class="modal-close" onclick="closeEducationModal()">✕</button>
            </div>
            <form id="educationForm" onsubmit="saveEducation(event)">
                <input type="hidden" id="eduIndex">
                <div class="form-group">
                    <label>学校名称</label>
                    <input type="text" id="eduSchool" placeholder="请输入学校名称" required>
                </div>
                <div class="form-group">
                    <label>学历 / 专业</label>
                    <input type="text" id="eduDegree" placeholder="例如：本科 / 汉语言文学" required>
                </div>
                <div class="form-group">
                    <label>时间段</label>
                    <input type="text" id="eduPeriod" placeholder="例如：2018 - 2022" required>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeEducationModal()">取消</button>
                    <button type="submit" class="btn btn-primary">保存</button>
                </div>
            </form>
        </div>
    </div>

    <div class="modal-overlay" id="profileModalOverlay">
        <div class="modal">
            <div class="modal-header">
                <h2>编辑个人信息</h2>
                <button class="modal-close" onclick="closeProfileModal()">✕</button>
            </div>
            <form id="profileForm" onsubmit="saveProfile(event)">
                <div class="form-group">
                    <label>姓名</label>
                    <input type="text" id="editName" required>
                </div>
                <div class="form-group">
                    <label>头衔</label>
                    <input type="text" id="editTitle" required>
                </div>
                <div class="form-group">
                    <label>个人简介</label>
                    <textarea id="editBio" placeholder="介绍一下你自己..."></textarea>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeProfileModal()">取消</button>
                    <button type="submit" class="btn btn-primary">保存</button>
                </div>
            </form>
        </div>
    </div>

    <div class="modal-overlay" id="infoModalOverlay">
        <div class="modal">
            <div class="modal-header">
                <h2 id="infoModalTitle">编辑信息</h2>
                <button class="modal-close" onclick="closeInfoModal()">✕</button>
            </div>
            <form id="infoForm" onsubmit="saveInfo(event)">
                <input type="hidden" id="infoField">
                <div class="form-group">
                    <label id="infoLabel"></label>
                    <input type="text" id="infoValue" required>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeInfoModal()">取消</button>
                    <button type="submit" class="btn btn-primary">保存</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let works = [];
        let currentViewId = null;
        let isSorting = false;

        const defaultProfile = {
            name: '你的名字',
            title: '作家 / 诗人',
            bio: '点击编辑个人简介...',
            email: 'your@email.com',
            phone: '138-0000-0000',
            location: '城市名称'
        };

        const defaultEducation = [
            { school: '学校名称', degree: '学历 / 专业', period: '20XX - 20XX' }
        ];

        function loadData() {
            const savedWorks = localStorage.getItem('portfolioWorks');
            const savedProfile = localStorage.getItem('portfolioProfile');
            const savedEducation = localStorage.getItem('portfolioEducation');

            if (savedWorks) {
                works = JSON.parse(savedWorks);
            }

            if (savedProfile) {
                const profile = JSON.parse(savedProfile);
                document.getElementById('profileName').textContent = profile.name;
                document.getElementById('profileTitle').textContent = profile.title;
                document.getElementById('profileBio').textContent = profile.bio || '点击编辑个人简介...';
                document.getElementById('infoEmail').textContent = profile.email;
                document.getElementById('infoPhone').textContent = profile.phone;
                document.getElementById('infoLocation').textContent = profile.location;
            }

            if (savedEducation) {
                const education = JSON.parse(savedEducation);
                renderEducation(education);
            } else {
                renderEducation(defaultEducation);
            }
        }

        function saveWorks() {
            localStorage.setItem('portfolioWorks', JSON.stringify(works));
        }

        function renderWorks(filter = 'all') {
            const grid = document.getElementById('worksGrid');
            
            const filteredWorks = filter === 'all' 
                ? works 
                : works.filter(w => w.category === filter);

            if (filteredWorks.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state" style="grid-column: 1 / -1;">
                        <span class="empty-icon">📝</span>
                        <h3>还没有作品</h3>
                        <p>点击右上角的「添加作品」按钮，开始记录你的文字吧</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = filteredWorks.map((work, index) => `
                <div class="work-card glass" 
                     draggable="${isSorting ? 'true' : 'false'}" 
                     ondragstart="dragWork(event, ${index})"
                     onclick="viewWork('${work.id}')">
                    <span class="work-category ${work.category}">${getCategoryName(work.category)}</span>
                    <h3 class="work-title">${work.title}</h3>
                    <p class="work-excerpt">${work.content}</p>
                    <div class="work-meta">
                        <span>${work.date}</span>
                        <div class="actions">
                            <button class="edit-btn" onclick="event.stopPropagation(); editWork('${work.id}')">✏️</button>
                            <button class="delete-btn" onclick="event.stopPropagation(); deleteWork('${work.id}')">🗑️</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function getCategoryName(category) {
            const names = { prose: '散文', poem: '诗歌', award: '获奖作品' };
            return names[category] || category;
        }

        function filterWorks(filter) {
            document.querySelectorAll('.filter-tab').forEach(tab => {
                tab.classList.toggle('active', tab.dataset.filter === filter);
            });
            renderWorks(filter);
        }

        function openAddWork() {
            document.getElementById('modalTitle').textContent = '添加作品';
            document.getElementById('workForm').reset();
            document.getElementById('workId').value = '';
            document.getElementById('workDate').value = new Date().toISOString().split('T')[0];
            document.getElementById('modalOverlay').classList.add('show');
        }

        function editWork(id) {
            const work = works.find(w => w.id === id);
            if (!work) return;

            document.getElementById('modalTitle').textContent = '编辑作品';
            document.getElementById('workId').value = work.id;
            document.getElementById('workTitle').value = work.title;
            document.getElementById('workCategory').value = work.category;
            document.getElementById('workDate').value = work.date;
            document.getElementById('workContent').value = work.content;
            document.getElementById('modalOverlay').classList.add('show');
        }

        function saveWork(e) {
            e.preventDefault();
            
            const id = document.getElementById('workId').value;
            const title = document.getElementById('workTitle').value;
            const category = document.getElementById('workCategory').value;
            const date = document.getElementById('workDate').value;
            const content = document.getElementById('workContent').value;

            if (id) {
                const index = works.findIndex(w => w.id === id);
                if (index >= 0) {
                    works[index] = { ...works[index], title, category, date, content };
                }
            } else {
                works.push({
                    id: Date.now().toString(),
                    title,
                    category,
                    date,
                    content
                });
            }

            saveWorks();
            closeModal();
            renderWorks(getActiveFilter());
        }

        function deleteWork(id) {
            if (confirm('确定要删除这个作品吗？')) {
                works = works.filter(w => w.id !== id);
                saveWorks();
                renderWorks(getActiveFilter());
            }
        }

        function viewWork(id) {
            const work = works.find(w => w.id === id);
            if (!work) return;

            currentViewId = id;
            document.getElementById('viewContent').innerHTML = `
                <span class="view-category ${work.category}">${getCategoryName(work.category)}</span>
                <h2>${work.title}</h2>
                <div class="view-date">${work.date}</div>
                <div class="view-body">${work.content}</div>
            `;
            document.getElementById('viewModalOverlay').classList.add('show');
        }

        function closeViewModal() {
            document.getElementById('viewModalOverlay').classList.remove('show');
            currentViewId = null;
        }

        function editCurrentWork() {
            closeViewModal();
            if (currentViewId) {
                editWork(currentViewId);
            }
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('show');
        }

        function getActiveFilter() {
            const activeTab = document.querySelector('.filter-tab.active');
            return activeTab ? activeTab.dataset.filter : 'all';
        }

        function toggleSortHint() {
            isSorting = !isSorting;
            const hint = document.getElementById('sortHint');
            hint.style.display = isSorting ? 'flex' : 'none';
            renderWorks(getActiveFilter());
        }

        function dragWork(e, index) {
            e.dataTransfer.setData('text/plain', index);
            e.target.classList.add('dragging');
        }

        function allowDrop(e) {
            e.preventDefault();
        }

        function dropWork(e) {
            e.preventDefault();
            const sourceIndex = parseInt(e.dataTransfer.getData('text/plain'));
            const targetElement = e.target.closest('.work-card');
            
            if (!targetElement || !isSorting) return;

            const targetIndex = Array.from(document.querySelectorAll('.work-card')).indexOf(targetElement);
            
            if (sourceIndex !== targetIndex) {
                const [removed] = works.splice(sourceIndex, 1);
                works.splice(targetIndex, 0, removed);
                saveWorks();
                renderWorks(getActiveFilter());
            }

            document.querySelector('.dragging')?.classList.remove('dragging');
        }

        function renderEducation(education) {
            const list = document.getElementById('educationList');
            list.innerHTML = education.map((edu, index) => `
                <div class="education-item">
                    <div class="edit-controls">
                        <button class="edit-btn" onclick="editEducation(${index})">✏️</button>
                        <button class="delete-btn" onclick="deleteEducation(${index})">🗑️</button>
                    </div>
                    <div class="edu-school">${edu.school}</div>
                    <div class="edu-degree">${edu.degree}</div>
                    <div class="edu-period">${edu.period}</div>
                </div>
            `).join('');
        }

        function addEducation() {
            document.getElementById('eduModalTitle').textContent = '添加教育经历';
            document.getElementById('educationForm').reset();
            document.getElementById('eduIndex').value = '';
            document.getElementById('educationModalOverlay').classList.add('show');
        }

        function editEducation(index) {
            const education = JSON.parse(localStorage.getItem('portfolioEducation') || JSON.stringify(defaultEducation));
            const edu = education[index];
            if (!edu) return;

            document.getElementById('eduModalTitle').textContent = '编辑教育经历';
            document.getElementById('eduIndex').value = index;
            document.getElementById('eduSchool').value = edu.school;
            document.getElementById('eduDegree').value = edu.degree;
            document.getElementById('eduPeriod').value = edu.period;
            document.getElementById('educationModalOverlay').classList.add('show');
        }

        function saveEducation(e) {
            e.preventDefault();
            
            const index = document.getElementById('eduIndex').value;
            const school = document.getElementById('eduSchool').value;
            const degree = document.getElementById('eduDegree').value;
            const period = document.getElementById('eduPeriod').value;

            let education = JSON.parse(localStorage.getItem('portfolioEducation') || JSON.stringify(defaultEducation));

            if (index !== '') {
                education[index] = { school, degree, period };
            } else {
                education.push({ school, degree, period });
            }

            localStorage.setItem('portfolioEducation', JSON.stringify(education));
            renderEducation(education);
            closeEducationModal();
        }

        function deleteEducation(index) {
            if (confirm('确定要删除这条教育经历吗？')) {
                let education = JSON.parse(localStorage.getItem('portfolioEducation') || JSON.stringify(defaultEducation));
                education.splice(index, 1);
                localStorage.setItem('portfolioEducation', JSON.stringify(education));
                renderEducation(education);
            }
        }

        function closeEducationModal() {
            document.getElementById('educationModalOverlay').classList.remove('show');
        }

        function openEditProfile() {
            const profile = JSON.parse(localStorage.getItem('portfolioProfile') || JSON.stringify(defaultProfile));
            document.getElementById('editName').value = profile.name;
            document.getElementById('editTitle').value = profile.title;
            document.getElementById('editBio').value = profile.bio || '';
            document.getElementById('profileModalOverlay').classList.add('show');
        }

        function saveProfile(e) {
            e.preventDefault();
            
            const profile = {
                name: document.getElementById('editName').value,
                title: document.getElementById('editTitle').value,
                bio: document.getElementById('editBio').value,
                email: document.getElementById('infoEmail').textContent,
                phone: document.getElementById('infoPhone').textContent,
                location: document.getElementById('infoLocation').textContent
            };

            localStorage.setItem('portfolioProfile', JSON.stringify(profile));
            
            document.getElementById('profileName').textContent = profile.name;
            document.getElementById('profileTitle').textContent = profile.title;
            document.getElementById('profileBio').textContent = profile.bio || '点击编辑个人简介...';
            
            closeProfileModal();
        }

        function closeProfileModal() {
            document.getElementById('profileModalOverlay').classList.remove('show');
        }

        function openEditInfo(field) {
            const labels = { email: '邮箱', phone: '电话', location: '所在地' };
            const profile = JSON.parse(localStorage.getItem('portfolioProfile') || JSON.stringify(defaultProfile));
            
            document.getElementById('infoModalTitle').textContent = `编辑${labels[field]}`;
            document.getElementById('infoLabel').textContent = labels[field];
            document.getElementById('infoField').value = field;
            document.getElementById('infoValue').value = profile[field] || '';
            document.getElementById('infoModalOverlay').classList.add('show');
        }

        function saveInfo(e) {
            e.preventDefault();
            
            const field = document.getElementById('infoField').value;
            const value = document.getElementById('infoValue').value;
            
            let profile = JSON.parse(localStorage.getItem('portfolioProfile') || JSON.stringify(defaultProfile));
            profile[field] = value;
            localStorage.setItem('portfolioProfile', JSON.stringify(profile));
            
            document.getElementById(`info${field.charAt(0).toUpperCase() + field.slice(1)}`).textContent = value;
            closeInfoModal();
        }

        function closeInfoModal() {
            document.getElementById('infoModalOverlay').classList.remove('show');
        }

        window.addEventListener('click', function(e) {
            if (e.target.classList.contains('modal-overlay')) {
                e.target.classList.remove('show');
            }
        });

        loadData();
        renderWorks();
    </script>
</body>
</html>
